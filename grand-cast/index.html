/* ================= churn insights ================= */
let churnSide = 'stated';
function churnInsights(all, active, gone){
  const li = (c, why, dot) => `<li><button data-go="${esc(c.id)}">${mini(c)}<span class="nm2">${esc(c.name)}</span><span class="why">${why}</span>${dot?`<span class="dot" style="background:${dot}"></span>`:''}</button></li>`;
  const bars = (rows, color) => { const mx = Math.max(1, ...rows.map(r => r[1])); return `<div class="bars">${rows.map(([k,n]) => `<div class="bar"><span title="${esc(k)}">${esc(k)}</span><div class="track"><div class="fill" style="width:${n/mx*100}%;${k==='Not recorded'?'background:#8e9aaa':(color?`background:${color}`:'')}"></div></div><b>${n}</b></div>`).join('')}</div>`; };
  const count = (arr, fn) => { const m = {}; arr.forEach(x => { const k = fn(x); if(k) m[k] = (m[k]||0) + 1; }); return Object.entries(m).sort((a,b) => b[1]-a[1]); };
  const pctTxt = (a, b) => b ? Math.round(100*a/b) + '%' : '–';
  const yearAgo = addMonths(TODAY, -12);
  const recent = gone.filter(c => c.cancelledOn && c.cancelledOn >= yearAgo && c.cancelledOn <= TODAY);

  // monthly churn rate over the last 12 full months
  const rates = [];
  for(let i = 12; i >= 1; i--){
    const start = addMonths(TODAY.slice(0,8) + '01', -i), end = addMonths(start, 1);
    const base = all.filter(c => c.since && c.since < start && !(isGone(c) && c.cancelledOn && c.cancelledOn < start)).length;
    const lost = gone.filter(c => c.cancelledOn && c.cancelledOn >= start && c.cancelledOn < end).length;
    if(base) rates.push(lost / base);
  }
  const avgRate = rates.length ? rates.reduce((a,b)=>a+b,0) / rates.length : 0;
  const lostRev = recent.filter(c => +c.price > 0).reduce((t,c) => t + +c.price, 0);
  const tenures = gone.filter(c => c.since && c.cancelledOn).map(c => monthsBetween(c.since, c.cancelledOn));
  const avgT = tenures.length ? tenures.reduce((a,b)=>a+b,0) / tenures.length : 0;
  const withCtrl = gone.filter(c => churnOf(c).ctrl);
  const ctrlN = withCtrl.filter(c => churnOf(c).ctrl === 'yes').length, partN = withCtrl.filter(c => churnOf(c).ctrl === 'partial').length;
  const invol = gone.filter(c => churnOf(c).cat === 'payment').length;
  const missing = gone.filter(c => churnMissing(c).length);

  // why they leave
  const side = churnSide === 'root' ? 'root' : 'stated';
  const pool = side === 'root' ? gone.filter(c => c.rootCategory) : gone;
  const catRows = count(pool, c => { const ch = churnOf(c); return side === 'root' ? catName(ch.root) : (ch.cat ? catName(ch.cat) : 'Not recorded'); });
  const specRows = count(pool, c => { const ch = churnOf(c); return side === 'root' ? ch.rootReason : ch.reason; }).slice(0, 8);
  const mism = gone.filter(c => c.rootCategory && churnOf(c).cat && c.rootCategory !== churnOf(c).cat);

  // saves
  const saves = []; all.forEach(c => (c.saves||[]).forEach(s => saves.push(Object.assign({client:c}, s))));
  const saved = saves.filter(s => s.outcome === 'saved' || s.outcome === 'downgraded');
  const byOffer = {}; saves.forEach(s => { const o = byOffer[s.offer] = byOffer[s.offer] || {n:0, ok:0}; o.n++; if(s.outcome !== 'lost') o.ok++; });
  const noAttempt = recent.filter(c => !(c.saves||[]).some(s => s.outcome === 'lost')).length;

  // early warning + timing
  const warnedPool = gone.filter(c => c.warned);
  const warnedYes = warnedPool.filter(c => c.warned === 'yes');
  const lead = warnedYes.filter(c => c.firstWarningOn && c.cancelledOn).map(c => days(c.firstWarningOn, c.noticeOn || c.cancelledOn));
  const timingRows = count(gone, c => TIMING[c.contractTiming] || '');

  // segments
  const seg = (fn) => { const m = {}; all.forEach(c => { const k = fn(c) || 'Not set'; m[k] = m[k] || {n:0, lost:0}; m[k].n++; if(isGone(c)) m[k].lost++; }); return Object.entries(m).sort((a,b) => b[1].lost - a[1].lost || b[1].n - a[1].n); };
  const segTable = (title, rows) => `<h3 style="font:700 16px var(--display);margin:12px 0 4px">${title}</h3><table><thead><tr><th>Segment</th><th>Clients</th><th>Cancelled</th><th>Churned</th></tr></thead><tbody>${rows.map(([k,v]) => `<tr><td>${esc(k)}</td><td>${v.n}</td><td>${v.lost}</td><td>${pctTxt(v.lost, v.n)}</td></tr>`).join('')}</tbody></table>`;

  // cohorts by start quarter
  const q = d => d.slice(0,4) + ' Q' + (Math.floor((+d.slice(5,7)-1)/3)+1);
  const coh = {}; all.filter(c => c.since).forEach(c => { const k = q(c.since); coh[k] = coh[k] || {n:0, live:0, lostT:[]}; coh[k].n++; if(isGone(c)){ if(c.cancelledOn) coh[k].lostT.push(monthsBetween(c.since, c.cancelledOn)); } else coh[k].live++; });
  const cohRows = Object.entries(coh).sort((a,b) => b[0].localeCompare(a[0]));

  // win-back
  const wb = gone.filter(c => c.winBack === 'yes' || c.winBack === 'maybe').sort((a,b) => (a.winBackOn||'9999').localeCompare(b.winBackOn||'9999'));

  return `
  <section class="card wide"><h2>Churn overview</h2><p class="sub">Last 12 months unless noted. Monthly churn rate = clients lost in a month divided by active clients at the start of that month, averaged.</p>
    <div class="stats">
      <div class="stat"><b>${rates.length ? (avgRate*100).toFixed(1) + '%' : '–'}</b><span>Avg monthly churn rate</span></div>
      <div class="stat"><b>${recent.length}</b><span>Cancelled in 12 months</span></div>
      <div class="stat"><b>${money(lostRev)}</b><span>Monthly revenue lost (priced clients)</span></div>
      <div class="stat"><b>${tenures.length ? avgT.toFixed(1) : '–'}</b><span>Avg months before cancelling</span></div>
      <div class="stat"><b>${withCtrl.length ? pctTxt(ctrlN, withCtrl.length) : '–'}</b><span>Controllable${partN?` (+${pctTxt(partN, withCtrl.length)} partly)`:''}</span></div>
      <div class="stat"><b>${invol}</b><span>Involuntary (payment)</span></div>
    </div>
    ${missing.length ? `<p class="empty"><span class="soon">${missing.length} of ${gone.length} cancellations are missing details.</span> Complete them so these reports are accurate:</p><ul class="ilist">${missing.slice(0,10).map(c => li(c, esc(churnMissing(c).join(', ')), '#E3B341')).join('')}</ul>${missing.length > 10 ? `<p class="empty">and ${missing.length - 10} more.</p>` : ''}` : (gone.length ? '<p class="empty">Every cancellation has complete churn details.</p>' : '')}
  </section>
  <section class="card"><h2>Why they leave</h2><p class="sub">${side === 'root' ? 'Root cause, as assessed by the account manager.' : 'What the client said.'}</p>
    <div class="seg" style="margin-bottom:12px;max-width:280px"><label><input type="radio" name="chSide" value="stated" ${side==='stated'?'checked':''}>What they said</label><label><input type="radio" name="chSide" value="root" ${side==='root'?'checked':''}>Root cause</label></div>
    ${catRows.length ? bars(catRows) : '<p class="empty">No data yet.</p>'}
    ${specRows.length ? `<h3 style="font:700 16px var(--display);margin:14px 0 6px">Top specific reasons</h3>${bars(specRows, '#5BC0EB')}` : ''}
  </section>
  <section class="card"><h2>Said vs. root cause</h2><p class="sub">Cancellations where the real reason differed from what the client told you.</p>
    <div class="stats"><div class="stat"><b>${mism.length}</b><span>Mismatched</span></div><div class="stat"><b>${gone.filter(c=>c.rootCategory).length}</b><span>Assessed so far</span></div></div>
    ${mism.length ? `<ul class="ilist">${mism.map(c => { const ch = churnOf(c); return li(c, `said ${esc(catName(ch.cat))}, really ${esc(catName(ch.root))}`); }).join('')}</ul>` : '<p class="empty">No mismatches recorded.</p>'}
  </section>
  <section class="card"><h2>Save attempts</h2><p class="sub">Offers made to clients at risk of cancelling, and what worked.</p>
    <div class="stats"><div class="stat"><b>${saves.length}</b><span>Attempts</span></div><div class="stat"><b>${pctTxt(saved.length, saves.length)}</b><span>Save rate</span></div><div class="stat"><b>${noAttempt}</b><span>Lost with no save attempt (12 mo)</span></div></div>
    ${Object.keys(byOffer).length ? `<table><thead><tr><th>Offer</th><th>Tried</th><th>Saved</th><th>Rate</th></tr></thead><tbody>${Object.entries(byOffer).sort((a,b)=>b[1].n-a[1].n).map(([o,v]) => `<tr><td>${esc(o)}</td><td>${v.n}</td><td>${v.ok}</td><td>${pctTxt(v.ok, v.n)}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">No save attempts recorded yet. Use "Record a save attempt" on an at-risk client.</p>'}
  </section>
  <section class="card"><h2>Early warning and timing</h2><p class="sub">Did the team see it coming, and when in the contract do clients leave?</p>
    <div class="stats"><div class="stat"><b>${pctTxt(warnedYes.length, warnedPool.length)}</b><span>Saw it coming</span></div><div class="stat"><b>${lead.length ? Math.round(lead.reduce((a,b)=>a+b,0)/lead.length) : '–'}</b><span>Avg days of warning</span></div></div>
    ${timingRows.length ? bars(timingRows, '#7C5CBF') : '<p class="empty">No contract timing recorded yet.</p>'}
  </section>
  <section class="card"><h2>Win-back list</h2><p class="sub">Former clients open to returning, by check-in date.</p>
    ${wb.length ? `<ul class="ilist">${wb.map(c => { const due = c.winBackOn && c.winBackOn <= addMonths(TODAY, 0) ; return li(c, `${WINBACK[c.winBack]}${c.winBackOn?`, ${esc(fmtDate(c.winBackOn))}`:''}`, due ? '#F85149' : (c.winBack==='yes'?'#3FB950':'#E3B341')); }).join('')}</ul>` : '<p class="empty">No one marked for win-back yet.</p>'}
  </section>
  <section class="card wide"><h2>Churn by segment</h2><p class="sub">All clients ever on the roster.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px">
      <div>${segTable('Account manager', seg(c => c.manager))}</div>
      <div>${segTable('Referral source', seg(c => referred(c) ? 'Referred' : 'Not referred'))}</div>
      <div>${segTable('Plan', seg(c => svcById(c.serviceId)?.name))}</div>
    </div>
  </section>
  <section class="card wide"><h2>Retention by start quarter</h2><p class="sub">Of the clients who started in each quarter, how many are still active.</p>
    <div style="overflow-x:auto"><table><thead><tr><th>Started</th><th>Clients</th><th>Still active</th><th>Retained</th><th>Avg months before cancelling</th></tr></thead><tbody>
      ${cohRows.map(([k,v]) => `<tr><td>${k}</td><td>${v.n}</td><td>${v.live}</td><td>${pctTxt(v.live, v.n)}</td><td>${v.lostT.length ? (v.lostT.reduce((a,b)=>a+b,0)/v.lostT.length).toFixed(1) : ''}</td></tr>`).join('')}
    </tbody></table></div>
  </section>`;
}

/* ================= drawer ================= */
let dTab = 'clients', editing = null, dQuery = '';
function openDrawer(tab, clientId){ if(!canWrite) return; dTab = tab; editing = clientId || null; $('drawerWrap').hidden = false; renderDrawer(); }
function closeDrawer(){ $('drawerWrap').hidden = true; editing = null; $('editBtn').focus(); }
$('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('drawerWrap').hidden) closeDrawer(); });

function renderDrawer(){
  $('drawer').innerHTML = `<div class="d-head"><h2>Manage clients</h2><button class="btn small" id="dClose">Done</button></div>
    <div class="tabs" role="tablist"><button role="tab" data-t="clients" aria-selected="${dTab==='clients'}">Clients</button><button role="tab" data-t="plans" aria-selected="${dTab==='plans'}">Plans</button></div>
    <div class="d-body" id="dInner"></div>`;
  $('dClose').addEventListener('click', closeDrawer);
  $('drawer').querySelectorAll('[role=tab]').forEach(b => b.addEventListener('click', () => { dTab = b.dataset.t; editing = null; renderDrawer(); }));
  if(dTab === 'plans') renderPlans(); else if(editing) renderClientForm(); else renderClientList();
}
function renderClientList(){
  const q = dQuery.toLowerCase();
  const list = S.clients.filter(c => !q || c.name.toLowerCase().includes(q)).sort((a,b) => isGone(a) - isGone(b) || a.name.localeCompare(b.name));
  const noReason = S.clients.filter(c => churnMissing(c).length).length;
  $('dInner').innerHTML = `<div style="display:flex;gap:8px;margin-bottom:8px"><input class="search" id="dq" placeholder="Search clients" value="${esc(dQuery)}"><button class="btn primary" id="addC" style="white-space:nowrap">Add client</button></div>
    ${noReason ? `<p class="d-warn">${noReason} cancelled ${noReason===1?'client is':'clients are'} missing churn details. Look for "details needed" below.</p>` : ''}
    ${list.map(c => { const s = svcById(c.serviceId); return `<div class="row">${mini(c)}<div class="grow"><b>${esc(c.name)}</b><small>${esc(s?s.name:'No plan')}${isGone(c)?`, cancelled${churnMissing(c).length?' (details needed)':''}`:''}</small></div><button class="btn small" data-e="${esc(c.id)}">Edit</button></div>`; }).join('')
      || `<p class="empty">${S.clients.length ? 'No clients match that search.' : 'No clients yet. Add your first one.'}</p>`}`;
  const qi = $('dq'); qi.addEventListener('input', () => { dQuery = qi.value; const p = qi.selectionStart; renderClientList(); const n = $('dq'); n.focus(); n.setSelectionRange(p,p); });
  $('addC').addEventListener('click', () => { if(!S.services.length){ toast('Add a plan first.'); dTab = 'plans'; return renderDrawer(); } editing = 'new'; renderDrawer(); });
  $('dInner').querySelectorAll('[data-e]').forEach(b => b.addEventListener('click', () => { editing = b.dataset.e; renderDrawer(); }));
}

function renderClientForm(){
  const isNew = editing === 'new';
  const src = isNew ? {id:'c' + uid(), name:'', serviceId:(ui.groupBy==='plan'&&focusGroup)||S.services[S.services.length-1]?.id||'', status:'active', since:TODAY, health:'', addons:[]} : byId(editing);
  if(!src){ editing = null; return renderClientList(); }
  const c = clean(src);
  let logo = c.logo || '', logoAssetId = c.logoAssetId || '';
  const ch0 = churnOf(c), lostSave0 = (c.saves||[]).find(s => s.outcome === 'lost');
  const managers = [...new Set(S.clients.map(x => x.manager).filter(Boolean))];
  const inner = $('dInner');
  inner.innerHTML = `<button class="btn small" id="back" style="margin-bottom:14px">Back to all clients</button>
    <div class="logo-edit"><div id="lp"></div><div style="display:flex;gap:8px;flex-wrap:wrap">
      <label class="btn small" style="cursor:pointer">Upload logo<input type="file" id="lf" accept="image/*" hidden></label>
      <button class="btn small" id="lr" ${logo?'':'hidden'}>Remove logo</button></div></div>
    <label class="field"><span>Client name</span><input id="fName" value="${esc(c.name)}"></label>
    <div class="two"><label class="field"><span>Plan</span><select id="fSvc">${S.services.map(s=>`<option value="${esc(s.id)}" ${s.id===c.serviceId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
      <label class="field"><span>Monthly price</span><input type="number" id="fPrice" min="0" step="1" value="${esc(c.price||'')}" placeholder="Optional"></label></div>
    <div class="field"><span>Status</span><div class="seg">
      <label><input type="radio" name="st" value="active" ${!isGone(c)?'checked':''}>Active</label>
      <label><input type="radio" name="st" value="cancelled" ${isGone(c)?'checked':''}>Cancelled</label></div></div>
    <fieldset class="fieldset" id="cxBox"><legend>Cancellation</legend>
      <div class="two"><label class="field"><span>Notice given on</span><input type="date" id="fNotice" value="${esc(c.noticeOn||'')}"></label>
        <label class="field"><span>Effective cancellation date</span><input type="date" id="fCx" value="${esc(c.cancelledOn||'')}"></label></div>
      <p class="d-warn" style="margin:2px 0 8px"><b>What they said</b></p>
      <div class="two"><label class="field"><span>Category</span><select id="fCat"><option value="">Choose…</option>${CHURN.map(x=>`<option value="${x.id}" ${ch0.cat===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
        <label class="field"><span>Specific reason</span><select id="fReason"></select></label></div>
      <label class="field" id="compWrap"><span>Which competitor or program?</span><input id="fComp" value="${esc(c.competitor||'')}" placeholder="Agency or program name"></label>
      <label class="field"><span>In their words</span><textarea id="fCxNote" placeholder="Capture what they actually said on the exit call">${esc(c.cancelNote||'')}</textarea></label>
      <p class="d-warn" style="margin:2px 0 8px"><b>Root cause</b> (your assessment)</p>
      <label class="toggle" style="margin-bottom:8px"><input type="checkbox" id="fSame" ${!c.rootCategory || (c.rootCategory===ch0.cat && (c.rootReason||'')===ch0.reason) ? 'checked' : ''}> Same as what they said</label>
      <div class="two" id="rootWrap"><label class="field"><span>Category</span><select id="fRootCat"><option value="">Choose…</option>${CHURN.map(x=>`<option value="${x.id}" ${c.rootCategory===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
        <label class="field"><span>Specific reason</span><select id="fRootReason"></select></label></div>
      <div class="field"><span>Was it controllable?</span><div class="seg">${[['yes','Yes'],['partial','Partly'],['no','No']].map(([k,v])=>`<label><input type="radio" name="ctrl" value="${k}" ${c.controllable===k?'checked':''}>${v}</label>`).join('')}</div></div>
      <div class="two"><label class="field"><span>Contract timing</span><select id="fTiming"><option value="">Choose…</option>${Object.entries(TIMING).map(([k,v])=>`<option value="${k}" ${c.contractTiming===k?'selected':''}>${esc(v)}</option>`).join('')}</select></label>
        <label class="field"><span>Did we see it coming?</span><select id="fWarned"><option value="">Choose…</option>${[['yes','Yes'],['no','No'],['unsure','Unsure']].map(([k,v])=>`<option value="${k}" ${c.warned===k?'selected':''}>${v}</option>`).join('')}</select></label></div>
      <label class="field" id="warnWrap"><span>When did the first warning signs appear?</span><input type="date" id="fWarnOn" value="${esc(c.firstWarningOn||'')}"></label>
      <div class="field"><span>Save attempt before they left?</span><div class="seg"><label><input type="radio" name="svA" value="yes" ${lostSave0?'checked':''}>Yes</label><label><input type="radio" name="svA" value="no" ${!lostSave0?'checked':''}>No</label></div></div>
      <div class="two" id="svWrap"><label class="field"><span>Offer made</span><select id="fSvOffer">${SAVE_OFFERS.map(o=>`<option ${lostSave0&&lostSave0.offer===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>
        <label class="field"><span>Notes on the offer</span><input id="fSvNote" value="${esc(lostSave0?lostSave0.note||'':'')}"></label></div>
      <div class="two"><label class="field"><span>Would they come back?</span><select id="fWin"><option value="">Choose…</option>${Object.entries(WINBACK).map(([k,v])=>`<option value="${k}" ${c.winBack===k?'selected':''}>${v}</option>`).join('')}</select></label>
        <label class="field" id="winWrap"><span>Check in on</span><input type="date" id="fWinOn" value="${esc(c.winBackOn||'')}"></label></div>
    </fieldset>
    <fieldset class="fieldset" id="hBox"><legend>Health and contact</legend>
      <div class="field"><span>Health</span><div class="seg">${['green','yellow','red',''].map(k=>`<label><input type="radio" name="hl" value="${k}" ${(c.health||'')===k?'checked':''}>${HEALTH[k].label}</label>`).join('')}</div></div>
      <div class="two"><label class="field"><span>Last strategy call</span><input type="date" id="fCall" value="${esc(c.lastCall||'')}"></label>
        <label class="field"><span>Last contact</span><input type="date" id="fContact" value="${esc(c.lastContact||'')}"></label></div></fieldset>
    <div class="field"><span>Add-ons</span><div id="fAdd"></div></div>
    <div class="two"><label class="field"><span>Client since</span><input type="date" id="fSince" value="${esc(c.since||'')}"></label>
      <label class="field"><span>Account manager</span><input id="fMgr" value="${esc(c.manager||'')}" list="mgrs"><datalist id="mgrs">${managers.map(m=>`<option value="${esc(m)}">`).join('')}</datalist></label></div>
    <label class="field"><span>Referred by</span><select id="fRef"><option value="">Not a referral</option>${S.clients.filter(x=>x.id!==c.id).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="${esc(x.id)}" ${x.id===c.referredBy?'selected':''}>${esc(x.name)}</option>`).join('')}<option value="__other" ${!c.referredBy&&c.referredByOther?'selected':''}>Someone not on the map</option></select></label>
    <label class="field" id="refOtherWrap"><span>Who referred them</span><input id="fRefOther" value="${esc(c.referredByOther||'')}" placeholder="Name of person or business"></label>
    <label class="field"><span>Location</span><input id="fLoc" value="${esc(c.location||'')}" placeholder="City, ST"></label>
    <label class="field"><span>Background notes</span><textarea id="fNotes" placeholder="Context that doesn't change often. Use the activity log for calls and updates.">${esc(c.notes||'')}</textarea></label>
    <div class="formbar"><button class="btn primary" id="save">${isNew?'Add client':'Save changes'}</button>${isNew?'':'<button class="btn danger" id="del">Delete client</button>'}</div>`;
  const stVal = () => inner.querySelector('[name=st]:checked').value;
  const drawLogo = () => { $('lp').innerHTML = logoHTML(Object.assign({}, c, {logo, name:$('fName').value||c.name, status:stVal()})); $('lr').hidden = !logo; };
  const syncSt = () => { const gone = stVal() === 'cancelled'; $('cxBox').hidden = !gone; $('hBox').hidden = gone; if(gone && !$('fCx').value){ $('fCx').value = TODAY; if(!$('fNotice').value) $('fNotice').value = TODAY; } if(gone && !$('fTiming').value) $('fTiming').value = suggestTiming(Object.assign({}, c, {serviceId:$('fSvc').value, since:$('fSince').value}), $('fCx').value); drawLogo(); };
  let addons = new Set(c.addons || []);
  const drawAdd = () => { const sv = svcById($('fSvc').value);
    $('fAdd').innerHTML = ADDONS.map(a => { const ok = sv && a.ok(sv); return `<label style="display:flex;gap:8px;align-items:center;padding:3px 0;${ok?'':'opacity:.45'}"><input type="checkbox" value="${a.id}" ${addons.has(a.id)&&ok?'checked':''} ${ok?'':'disabled'} style="accent-color:var(--gold)">${esc(a.name)}${ok?'':` <small style="color:var(--muted)">${esc(a.why||'')}</small>`}</label>`; }).join('');
    $('fAdd').querySelectorAll('input').forEach(i => i.addEventListener('change', () => { i.checked ? addons.add(i.value) : addons.delete(i.value); })); };
  const syncRef = () => { $('refOtherWrap').hidden = $('fRef').value !== '__other'; };
  const fillReasons = (catSel, rSel, val) => { const cat = catById($(catSel).value); $(rSel).innerHTML = cat ? `<option value="">Choose…</option>` + cat.reasons.map(r => `<option ${r===val?'selected':''}>${esc(r)}</option>`).join('') : '<option value="">Pick a category first</option>'; };
  const syncChurn = () => {
    $('compWrap').hidden = $('fCat').value !== 'competitor';
    $('rootWrap').hidden = $('fSame').checked;
    $('warnWrap').hidden = $('fWarned').value !== 'yes';
    $('svWrap').hidden = inner.querySelector('[name=svA]:checked').value !== 'yes';
    $('winWrap').hidden = !$('fWin').value || $('fWin').value === 'no';
  };
  fillReasons('fCat', 'fReason', ch0.reason); fillReasons('fRootCat', 'fRootReason', c.rootReason || '');
  $('fCat').addEventListener('change', () => { fillReasons('fCat', 'fReason', ''); const cat = catById($('fCat').value); if(cat && cat.ctrl && !inner.querySelector('[name=ctrl]:checked')){ const r = inner.querySelector(`[name=ctrl][value=${cat.ctrl}]`); if(r) r.checked = true; } syncChurn(); });
  $('fRootCat').addEventListener('change', () => { fillReasons('fRootCat', 'fRootReason', ''); const cat = catById($('fRootCat').value); if(cat && cat.ctrl){ const r = inner.querySelector(`[name=ctrl][value=${cat.ctrl}]`); if(r) r.checked = true; } });
  $('fSame').addEventListener('change', () => { if(!$('fSame').checked && !$('fRootCat').value){ $('fRootCat').value = $('fCat').value; fillReasons('fRootCat', 'fRootReason', $('fReason').value); } syncChurn(); });
  ['fWarned','fWin'].forEach(id => $(id).addEventListener('change', () => { if(id === 'fWin' && $('fWin').value && $('fWin').value !== 'no' && !$('fWinOn').value) $('fWinOn').value = addMonths($('fCx').value || TODAY, 3); syncChurn(); }));
  inner.querySelectorAll('[name=svA]').forEach(r => r.addEventListener('change', syncChurn));
  $('fCx').addEventListener('change', () => { if(!$('fTiming').value) $('fTiming').value = suggestTiming(Object.assign({}, c, {serviceId:$('fSvc').value, since:$('fSince').value}), $('fCx').value); });
  if(isGone(c) && !$('fTiming').value) $('fTiming').value = suggestTiming(c, c.cancelledOn);
  syncChurn();
  drawAdd(); syncSt(); syncRef();
  $('fSvc').addEventListener('change', drawAdd); $('fRef').addEventListener('change', syncRef);
  inner.querySelectorAll('[name=st]').forEach(r => r.addEventListener('change', syncSt));
  $('fName').addEventListener('input', drawLogo);
  $('back').addEventListener('click', () => { editing = null; renderDrawer(); });
  $('lf').addEventListener('change', async e => {
    const f = e.target.files[0]; if(!f) return;
    try { const r = await processLogo(f); logo = r.url; logoAssetId = r.id || ''; drawLogo(); }
    catch(err){ toast(err && err.message ? err.message : 'That file could not be used as a logo. Try a PNG or JPG.', 4000); }
  });
  $('lr').addEventListener('click', () => { logo = ''; logoAssetId = ''; drawLogo(); });
  $('save').addEventListener('click', async () => {
    const name = $('fName').value.trim(); if(!name){ $('fName').focus(); return toast('Add a client name.'); }
    const status = stVal();
    if(status === 'cancelled'){
      if(!$('fCat').value){ $('fCat').focus(); return toast('Choose what they said: the cancellation category.'); }
      if(!$('fReason').value){ $('fReason').focus(); return toast('Choose the specific reason.'); }
      if($('fCat').value === 'other' && !$('fCxNote').value.trim()){ $('fCxNote').focus(); return toast('For "Other", write down what they said.'); }
      if(!$('fSame').checked && !$('fRootCat').value){ $('fRootCat').focus(); return toast('Choose the root cause, or tick "Same as what they said".'); }
    }
    const goneNow = status === 'cancelled', same = $('fSame').checked;
    let saves = (c.saves || []).filter(s => s.outcome !== 'lost');
    if(goneNow && inner.querySelector('[name=svA]:checked').value === 'yes') saves.push({date: $('fNotice').value || $('fCx').value || TODAY, offer: $('fSvOffer').value, outcome: 'lost', note: $('fSvNote').value.trim()});
    const churnFields = goneNow ? {
      noticeOn: $('fNotice').value, cancelCategory: $('fCat').value, cancelReason: $('fReason').value, competitor: $('fCat').value === 'competitor' ? $('fComp').value.trim() : '',
      rootCategory: same ? $('fCat').value : $('fRootCat').value, rootReason: same ? $('fReason').value : $('fRootReason').value,
      controllable: inner.querySelector('[name=ctrl]:checked')?.value || '', contractTiming: $('fTiming').value,
      warned: $('fWarned').value, firstWarningOn: $('fWarned').value === 'yes' ? $('fWarnOn').value : '',
      winBack: $('fWin').value, winBackOn: ($('fWin').value && $('fWin').value !== 'no') ? $('fWinOn').value : ''
    } : {noticeOn:'', cancelCategory:'', cancelReason:'', competitor:'', rootCategory:'', rootReason:'', controllable:'', contractTiming:'', warned:'', firstWarningOn:'', winBack:'', winBackOn:''};
    const sv = svcById($('fSvc').value), refv = $('fRef').value;
    const rec = Object.assign(c, {
      name, serviceId:$('fSvc').value, status, price: +$('fPrice').value || 0,
      cancelledOn: status==='cancelled' ? $('fCx').value : '', cancelNote: status==='cancelled' ? $('fCxNote').value.trim() : '', saves, ...churnFields,
      health: inner.querySelector('[name=hl]:checked')?.value || '', lastCall:$('fCall').value, lastContact:$('fContact').value,
      since:$('fSince').value, manager:$('fMgr').value.trim(), location:$('fLoc').value.trim(), notes:$('fNotes').value.trim(), logo, logoAssetId,
      referredBy: (refv && refv !== '__other') ? refv : '', referredByOther: refv === '__other' ? $('fRefOther').value.trim() : '',
      addons: [...addons].filter(id => { const a = ADDONS.find(x => x.id === id); return sv && a && a.ok(sv); })
    });
    const wasGone = !isNew && isGone(src) !== (status === 'cancelled');
    $('save').disabled = true;
    if(await saveClient(rec)){
      if(isNew) addLog(rec.id, 'note', 'Added to the Grand Cast');
      else if(wasGone) addLog(rec.id, status === 'cancelled' ? 'issue' : 'win', status === 'cancelled' ? `Cancelled: ${churnLabel(rec.cancelCategory, rec.cancelReason)}${rec.cancelNote ? ` ("${rec.cancelNote}")` : ''}` : 'Reactivated');
      if(src.logoAssetId && src.logoAssetId !== logoAssetId){ B.deleteLogo(src.logoAssetId).catch(()=>{}); }
      toast(isNew ? 'Client added' : 'Changes saved'); editing = null; selected = rec.id; renderDrawer();
    } else $('save').disabled = false;
  });
  if(!isNew) $('del').addEventListener('click', async () => {
    if(!confirm(`Delete ${c.name} from the Grand Cast? Their activity log is deleted too. To keep them as a past client, mark them Cancelled instead.`)) return;
    try {
      for(const x of S.clients.filter(x => x.referredBy === c.id)) await patchClient(x.id, {referredBy:'', referredByOther:c.name});
      await B.deleteClient(c.id);
      if(c.logoAssetId) B.deleteLogo(c.logoAssetId).catch(()=>{});
      if(selected === c.id) selected = null;
      editing = null; renderDrawer(); toast('Client deleted');
    } catch(e){ writeError(e); }
  });
}

/* logo: resize to 200px, upload to the asset store when available */
function processLogo(file){
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = () => rej(new Error('That file could not be read.'));
    fr.onload = () => {
      const img = new Image(); img.onerror = () => rej(new Error('That file is not an image this browser can read. Try a PNG or JPG.'));
      img.onload = () => {
        const Sz = 200, cv = document.createElement('canvas'); cv.width = Sz; cv.height = Sz;
        const ctx = cv.getContext('2d'), w0 = img.naturalWidth||Sz, h0 = img.naturalHeight||Sz, sc = Math.min(Sz/w0, Sz/h0);
        ctx.drawImage(img, (Sz-w0*sc)/2, (Sz-h0*sc)/2, w0*sc, h0*sc);
        cv.toBlob(async blob => {
          if(!blob) return rej(new Error('That image could not be processed.'));
          try { res(await B.uploadLogo(blob)); }
          catch(e){ rej(new Error(e && e.code === 'quota' ? 'Logo storage is full. Remove unused logos and try again.' : 'The logo upload failed. Try again.')); }
        }, 'image/png');
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function renderPlans(){
  const inner = $('dInner');
  inner.innerHTML = `<p class="d-warn" style="margin-top:0">Term sets each client's renewal date. Call cadence (days between strategy calls) drives the overdue-call alerts; leave it blank for plans without scheduled calls.</p>
    <div class="row" style="font-size:12px;color:var(--muted);border:0;padding-bottom:0"><span style="width:36px"></span><span style="flex:1">Name</span><span style="width:64px">Term (mo)</span><span style="width:64px">Call every (days)</span><span style="width:60px"></span></div>
    ${S.services.map(s => { const n = S.clients.filter(c => c.serviceId === s.id).length;
      return `<div class="row svc-row" data-id="${esc(s.id)}"><input type="color" value="${esc(s.color)}" aria-label="Color for ${esc(s.name)}"><input type="text" value="${esc(s.name)}" aria-label="Plan name" style="flex:1"><input type="number" data-k="term" value="${esc(s.term||'')}" aria-label="Contract months" style="width:64px"><input type="number" data-k="cadence" value="${esc(s.cadence||'')}" aria-label="Days between strategy calls" style="width:64px"><button class="btn small danger" data-del ${n?`title="${n} clients on this plan"`:''}>Delete</button></div>`; }).join('')}
    <div class="formbar" style="margin-top:14px"><button class="btn" id="addS">Add plan</button><button class="btn primary" id="saveS">Save plans</button></div>`;
  const commit = () => inner.querySelectorAll('.svc-row').forEach(r => { const s = svcById(r.dataset.id); if(!s) return;
    s.name = r.querySelector('input[type=text]').value.trim() || s.name; s.color = r.querySelector('input[type=color]').value;
    s.term = +r.querySelector('[data-k=term]').value || 0; s.cadence = +r.querySelector('[data-k=cadence]').value || 0; });
  inner.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    const id = b.closest('.row').dataset.id, n = S.clients.filter(c => c.serviceId === id).length;
    if(n) return toast(`Move the ${n} ${n===1?'client':'clients'} on this plan first.`, 3400);
    commit(); S.services = S.services.filter(s => s.id !== id); savePlans(); renderPlans();
  }));
  $('addS').addEventListener('click', () => { commit(); S.services.push({id:'p' + uid(), name:'New plan', color:PALETTE[S.services.length % PALETTE.length], term:0, cadence:0}); renderPlans(); });
  $('saveS').addEventListener('click', () => { commit(); savePlans(); });
}

/* ================= boot ================= */
setView(ui.view);
renderAll(true);
(async () => {
  try {
    B = createBackend(window.GRAND_CAST_CONFIG || {});
    const info = await B.init();
    canWrite = !!info.canWrite; myId = info.userId || null; needsSignIn = !!info.needsSignIn;
  } catch(e){ console.error(e); B = null; loadError = 'Could not connect to the database. Check GRAND_CAST_CONFIG at the top of this file.'; renderChrome(); return; }
  if(needsSignIn){ renderAll(false); return; }
  let first = true;
  B.watchPlans(list => { S.services = clean(list); S.plansLoaded = true; renderAll(false); });
  B.watchClients(list => { S.clients = clean(list); S.clientsLoaded = true; renderAll(first); first = false; });
})();
})();
