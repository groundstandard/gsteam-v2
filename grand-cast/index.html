<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>The Grand Cast | Ground Standard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5;--surface:#ffffff;--surface-2:#f6f8fb;--ink:#0d1b2a;--muted:#5b6b7c;--line:#d6dde6;
  --gold:#f5a623;--gold-ink:#8a5600;--board:#0d1b2a;--board-2:#132a42;
  --red:#d93a42;--amber:#c98a0c;--green:#2f9e57;--blue:#3a7bd5;--ref:#7FD1FF;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow','Segoe UI',Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07111d;--surface:#0f2133;--surface-2:#0b1a2a;--ink:#e8eef5;--muted:#9fb0c2;--line:#22374d;--gold-ink:#f5c26b;--red:#ff6b72;--amber:#f2c94c;--green:#4cc77a}}
:root[data-theme="dark"]{--bg:#07111d;--surface:#0f2133;--surface-2:#0b1a2a;--ink:#e8eef5;--muted:#9fb0c2;--line:#22374d;--gold-ink:#f5c26b;--red:#ff6b72;--amber:#f2c94c;--green:#4cc77a}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);display:flex;flex-direction:column}
#root{flex:1;min-height:0;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.badge{width:46px;height:46px;border-radius:50%;background:var(--gold);color:#0d1b2a;display:grid;place-items:center;font:800 20px var(--display);flex:none}
.brand h1{margin:0;font:800 30px/1 var(--display);letter-spacing:.01em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:14px}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.views{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.views button{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:600;color:var(--muted)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.views .count{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font:700 12px/18px var(--display)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#0d1b2a}
.btn.danger{color:var(--red)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;padding:0 24px 10px;flex-wrap:wrap}
.toolbar .search{flex:1 1 220px;max-width:340px}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:100%}
.sel{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.sel select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;color:var(--ink)}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--gold);width:16px;height:16px}
.notice{margin:0 24px 10px;padding:10px 14px;border-radius:8px;background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);font-size:14px}

/* map view */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);padding:0 24px 18px;gap:16px}
.stage.has-panel{grid-template-columns:minmax(0,1fr) 360px}
.mapcol{display:flex;flex-direction:column;min-height:0;gap:8px}
.board{position:relative;flex:1;min-height:440px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 50%,var(--board-2) 0,var(--board) 70%)}
.board::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 119px,rgba(245,166,35,.05) 119px 120px)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
#map.dragging{cursor:grabbing}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.zoom button{background:rgba(255,255,255,.1);color:#e8eef5;border:1px solid rgba(255,255,255,.18);border-radius:8px;min-width:36px;height:36px;font-weight:600}
.zoom button:hover{background:rgba(255,255,255,.18)}
.legend{position:absolute;left:12px;bottom:12px;right:150px;display:flex;gap:12px;color:#b5c3d2;font-size:12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid}
.asof{position:absolute;left:12px;top:12px;background:rgba(245,166,35,.95);color:#0d1b2a;border-radius:8px;padding:4px 10px;font:700 14px var(--display)}
.timeline{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.timeline input[type=range]{flex:1;accent-color:var(--gold)}
.timeline .when{font:700 15px var(--display);min-width:170px}
.timeline .when small{font:500 13px var(--body);color:var(--muted);margin-left:6px}

/* svg */
.svgtxt{font-family:var(--display)}
.edge{stroke-width:2;fill:none}
.edge.cx{stroke:#6b7787;stroke-dasharray:4 5;opacity:.55}
.node{cursor:pointer;outline:none}
.node:focus-visible .focusring{stroke:var(--gold);stroke-width:3}
.client .nm{fill:#e8eef5;font:600 13px var(--display);text-anchor:middle;paint-order:stroke;stroke:#0d1b2a;stroke-width:3px}
.client .gone{fill:#8e9aaa;font:600 11px var(--display);text-anchor:middle;letter-spacing:.04em}
.client.cancelled .art{filter:url(#gray);opacity:.45}
.client.cancelled .nm{fill:#8e9aaa}
.client .ini{font:700 18px var(--display);text-anchor:middle;dominant-baseline:central;fill:#0d1b2a}
.client .ab{fill:#0d1b2a;font:800 11px var(--display);text-anchor:middle;dominant-baseline:central}
svg.quiet .client .nm,svg.quiet .client .gone{display:none}
svg.quiet .client:hover .nm,svg.quiet .client.sel .nm,svg.quiet .client.match .nm,svg.quiet .client:focus .nm{display:block}
.hub .hn{fill:#fff;font:700 15px var(--display);text-anchor:middle}
.hub .hc{fill:#9fb0c2;font:600 12px var(--display);text-anchor:middle}
.dim{opacity:.16}
.ref{fill:none;stroke:var(--ref);stroke-width:2.5;opacity:.75;stroke-linecap:round}
.ref.hot{stroke-width:3.5;opacity:1}
.ref.faint{opacity:.1}
.center .c1{font:800 34px var(--display);text-anchor:middle;fill:#0d1b2a}
.center .c2{font:700 9.5px var(--display);text-anchor:middle;fill:#0d1b2a;letter-spacing:.06em}
@media (prefers-reduced-motion:no-preference){.node{transition:opacity .2s}}

/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;overflow:auto;max-height:100%;position:relative}
.panel .x{position:absolute;top:10px;right:10px;border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:6px}
.p-logo{width:88px;height:88px;border-radius:50%;background:#fff;border:3px solid var(--gold);display:grid;place-items:center;overflow:hidden;margin-bottom:10px;flex:none}
.p-logo img{width:76%;height:76%;object-fit:contain}
.p-logo .ini{font:800 30px var(--display);color:#0d1b2a}
.p-logo.gone{filter:grayscale(1);opacity:.6;border-style:dashed;border-color:#8e9aaa}
.panel h2{margin:0 0 6px;font:800 25px/1.1 var(--display)}
.status{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px}
.status.on{background:#e3f4e5;color:#21612a}
.status.off{background:#eceff3;color:#56606c}
.flags{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.flag{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:7px 10px;border-radius:8px;background:var(--surface-2);border-left:4px solid var(--muted)}
.flag.red{border-left-color:var(--red)}.flag.amber{border-left-color:var(--amber)}.flag.info{border-left-color:var(--blue)}.flag.good{border-left-color:var(--green)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 16px;font-size:14px}
dt{color:var(--muted)}dd{margin:0;min-width:0;overflow-wrap:anywhere}
.p-notes{font-size:14px;white-space:pre-wrap;border-top:1px solid var(--line);padding-top:12px;margin-bottom:12px}
.p-list{list-style:none;padding:0;margin:8px 0 0}
.p-list li button{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px}
.p-list li button:hover{color:var(--gold-ink)}
.mini{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--c,#ccc);display:grid;place-items:center;overflow:hidden;flex:none;font:700 12px var(--display);color:#0d1b2a}
.mini img{width:76%;height:76%;object-fit:contain}
.mini.gone{filter:grayscale(1);opacity:.55}
.svcpill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.svcpill .dot,.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-decoration-color:var(--ref);text-underline-offset:3px;text-align:left}
.linkbtn:hover{color:var(--gold-ink)}
.log h3,.panel h3{font:700 17px var(--display);margin:16px 0 8px}
.log-form{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.log-form textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px;min-height:60px;resize:vertical}
.log-form .row2{display:flex;gap:8px}
.log-form select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px}
.entry{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.entry .meta{color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center}
.kind{font:700 11px var(--display);letter-spacing:.04em;border-radius:4px;padding:1px 6px;background:var(--surface-2);border:1px solid var(--line)}
.kind.call{color:var(--blue)}.kind.win{color:var(--green)}.kind.issue{color:var(--red)}
.entry p{margin:3px 0 0;white-space:pre-wrap}

/* table view */
.tablewrap{flex:1;min-height:0;margin:0 24px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);z-index:1;font-weight:600;color:var(--muted)}
th button{border:0;background:none;padding:0;font:inherit;color:inherit}
th button[aria-sort]{color:var(--ink)}
tbody tr:hover{background:var(--surface-2)}
td.name{max-width:280px;overflow:hidden;text-overflow:ellipsis}
td.name button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-weight:600;max-width:100%}
td.name button span{overflow:hidden;text-overflow:ellipsis}
tr.gone td{color:var(--muted)}
.hdot{display:inline-flex;align-items:center;gap:6px}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 24px 10px;padding:8px 12px;border-radius:10px;background:var(--ink);color:var(--surface)}
.bulk select,.bulk input{border:1px solid rgba(255,255,255,.3);background:transparent;color:inherit;border-radius:6px;padding:5px 8px}
.bulk select option{color:#0d1b2a}
.bulk .btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.35)}
.warn{color:var(--red);font-weight:600}.soon{color:var(--amber);font-weight:600}

/* insights */
.insights{flex:1;min-height:0;overflow:auto;padding:0 24px 24px}
.ins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card.wide{grid-column:1/-1}
.card h2{margin:0 0 2px;font:800 21px var(--display)}
.card .sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:10px}
.stat b{display:block;font:800 28px/1.1 var(--display)}
.stat span{font-size:13px;color:var(--muted)}
.ilist{list-style:none;margin:0;padding:0}
.ilist li{border-top:1px solid var(--line)}
.ilist button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:8px 0;text-align:left}
.ilist button:hover .nm2{color:var(--gold-ink)}
.ilist .nm2{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ilist .why{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:150px 1fr 30px;gap:8px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:5px;background:var(--gold)}
.empty{color:var(--muted);font-size:14px;margin:6px 0}
.chart{width:100%;height:auto;display:block}
.chart text{font:600 11px var(--display);fill:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,12,20,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);border-left:1px solid var(--line)}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
.d-head h2{margin:0;font:800 24px var(--display)}
.tabs{display:flex;gap:4px;padding:12px 20px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.d-body{flex:1;overflow:auto;padding:16px 20px 24px}
.d-warn{font-size:13px;color:var(--muted);margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .grow small{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:14px}
.field>span{color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field input,.field select,.field textarea{min-width:0;width:100%}
.d-body{overflow-x:hidden}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:8px 4px;cursor:pointer;font-weight:600;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--surface)}
.seg label:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:-3px}
.logo-edit{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo-edit .p-logo{width:64px;height:64px;margin:0;border-width:2px}
.formbar{display:flex;gap:8px;justify-content:space-between;margin-top:6px;flex-wrap:wrap}
.svc-row input{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px;min-width:0}
.svc-row input[type=color]{width:36px;height:32px;padding:2px}
.fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 12px 2px;margin-bottom:14px}
.fieldset legend{padding:0 6px;font:700 15px var(--display)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;opacity:0;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}

@media (max-width:860px){
  .top{padding:12px 14px 8px}.toolbar{padding:0 14px 8px}.notice{margin:0 14px 8px}
  .stage,.stage.has-panel{grid-template-columns:minmax(0,1fr);padding:0 10px 10px}
  .panel{position:fixed;left:0;right:0;bottom:0;max-height:66vh;border-radius:16px 16px 0 0;z-index:15;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .brand h1{font-size:26px}
  .legend{display:none}
  .tablewrap{margin:0 10px 10px}.insights{padding:0 10px 14px}.bulk{margin:0 10px 8px}
  .timeline .when{min-width:0}
}

.mini-t{font-size:13px;width:100%}
.mini-t th,.mini-t td{padding:4px 6px}
.mini-t small{color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div>
<!-- =====================================================================
     CONFIG: the only thing to edit for a basic deploy.
     backend: 'supabase' for the real shared database, 'demo' to try it
     locally from grand-cast-data.json (edits stay in your browser).
     The anon key is safe in the browser; row-level security in
     schema.sql controls access. Never put the service_role key here.
     ===================================================================== -->
<script src="/config.js"></script>
<script>
/* GS Team Scoreboard: the Grand Cast uses the scoreboard's own Supabase project and sign-in, read from
   its /config.js, so the same file works on v1 and v2. Its data lives in its own tables (gc_*). Without
   a config.js (opened on its own) it falls back to demo mode. */
(function () {
  var c = window.CABT_CONFIG || {};
  window.GRAND_CAST_CONFIG = {
    backend: c.SUPABASE_URL ? 'supabase' : 'demo',
    supabaseUrl: c.SUPABASE_URL || '',
    supabaseAnonKey: c.SUPABASE_ANON_KEY || '',
    tables: { plans: 'gc_plans', clients: 'gc_clients', log: 'gc_log' },
    logoBucket: 'grand-cast-logos',
    seedUrl: 'grand-cast-data.json'
  };
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<!-- ===================== BACKEND ADAPTER (swap point) ===================== -->
<script>
/* =====================================================================
   GRAND CAST BACKEND ADAPTER
   ---------------------------------------------------------------------
   Every read and write the app makes goes through the object returned
   by createBackend(). To connect the Grand Cast to a different stack,
   implement these methods and nothing else in the app has to change.

   Data shapes the app expects (camelCase, dates as 'YYYY-MM-DD' or ''):
     Plan   {id, name, color, term, cadence, standard, blurb}
     Client {id, name, serviceId, status:'active'|'cancelled', since,
             cancelledOn, cancelReason, cancelNote, health:'green'|'yellow'|'red'|'',
             lastCall, lastContact, price, manager, location, notes,
             logo (image URL), logoAssetId (storage path), referredBy (client id),
             referredByOther, addons:string[], updatedAt,
             churn (cancelled clients): noticeOn, cancelCategory, cancelReason (specific), cancelNote (their words),
             rootCategory, rootReason, controllable:'yes'|'partial'|'no', contractTiming:'onboarding'|'midterm'|'renewal'|'monthly',
             warned:'yes'|'no'|'unsure', firstWarningOn, competitor, winBack:'yes'|'maybe'|'no', winBackOn,
             saves: [{date, offer, outcome:'saved'|'downgraded'|'lost', note}] (also on active clients),
             sb: scoreboard snapshot or null, see README "Scoreboard data"}
     Log    {id, clientId, kind:'note'|'call'|'contact'|'win'|'issue', text, at (ISO), authorId, authorName}

   Interface:
     init()                         -> Promise<{canWrite:boolean, userId:string|null, needsSignIn?:boolean}>
     watchPlans(cb)                 -> unsubscribe fn; cb(Plan[]) now and on every change
     watchClients(cb)               -> unsubscribe fn; cb(Client[]) now and on every change
     watchLog(clientId, cb, onErr)  -> unsubscribe fn; cb(Log[]) now and on every change
     saveClient(client)             -> Promise   (full upsert)
     updateClient(id, fields)       -> Promise   (partial update)
     deleteClient(id)               -> Promise   (also deletes its log entries)
     savePlans(plans)               -> Promise   (replace the full list)
     addLog(entry)                  -> Promise
     uploadLogo(blob)               -> Promise<{url, id}>   (id = storage path, used to delete later)
     deleteLogo(id)                 -> Promise
     userNames(ids)                 -> Promise<{[id]: name}>
     signIn(email)                  -> Promise   (optional; magic-link fallback)
   Errors: throw {code, message}. Codes the UI understands:
     'forbidden' (no write access), 'quota', 'rate_limited', anything else = generic failure.
   ===================================================================== */

function createBackend(cfg){
  if(cfg.backend === 'supabase') return supabaseBackend(cfg);
  return demoBackend(cfg);
}

/* ---------------------------------------------------------------------
   SUPABASE  (schema.sql creates the tables, policies, realtime and the
   'logos' storage bucket this adapter uses)
   --------------------------------------------------------------------- */
function supabaseBackend(cfg){
  if(!window.supabase || !window.supabase.createClient) throw new Error('supabase-js did not load');
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const T = Object.assign({plans:'plans', clients:'clients', log:'log'}, cfg.tables || {});
  const BUCKET = cfg.logoBucket || 'logos';
  let session = null;

  const nz = v => (v === '' || v === undefined) ? null : v;
  const toClientRow = c => ({
    id: c.id, name: c.name, service_id: nz(c.serviceId), status: c.status || 'active',
    since: nz(c.since), cancelled_on: nz(c.cancelledOn), cancel_reason: nz(c.cancelReason), cancel_note: nz(c.cancelNote),
    health: c.health || '', last_call: nz(c.lastCall), last_contact: nz(c.lastContact), price: c.price ? +c.price : null,
    manager: nz(c.manager), location: nz(c.location), notes: nz(c.notes), logo_url: nz(c.logo), logo_path: nz(c.logoAssetId),
    referred_by: nz(c.referredBy), referred_by_other: nz(c.referredByOther), addons: c.addons || [],
    notice_on: nz(c.noticeOn), cancel_category: nz(c.cancelCategory), root_category: nz(c.rootCategory), root_reason: nz(c.rootReason),
    controllable: nz(c.controllable), contract_timing: nz(c.contractTiming), warned: nz(c.warned), first_warning_on: nz(c.firstWarningOn),
    competitor: nz(c.competitor), win_back: nz(c.winBack), win_back_on: nz(c.winBackOn), saves: c.saves || [],
    sb: c.sb || null, ...(c.sb ? {scoreboard_id: c.sb.id} : {}),
    updated_at: new Date().toISOString()
  });
  const FIELD = {name:'name', serviceId:'service_id', status:'status', since:'since', cancelledOn:'cancelled_on', cancelReason:'cancel_reason',
    cancelNote:'cancel_note', health:'health', lastCall:'last_call', lastContact:'last_contact', price:'price', manager:'manager', location:'location',
    notes:'notes', logo:'logo_url', logoAssetId:'logo_path', referredBy:'referred_by', referredByOther:'referred_by_other', addons:'addons',
    noticeOn:'notice_on', cancelCategory:'cancel_category', rootCategory:'root_category', rootReason:'root_reason', controllable:'controllable',
    contractTiming:'contract_timing', warned:'warned', firstWarningOn:'first_warning_on', competitor:'competitor', winBack:'win_back', winBackOn:'win_back_on', saves:'saves', sb:'sb'};
  const fromClientRow = r => ({
    id: r.id, name: r.name, serviceId: r.service_id || '', status: r.status, since: r.since || '', cancelledOn: r.cancelled_on || '',
    cancelReason: r.cancel_reason || '', cancelNote: r.cancel_note || '', health: r.health || '', lastCall: r.last_call || '',
    lastContact: r.last_contact || '', price: r.price ? +r.price : 0, manager: r.manager || '', location: r.location || '', notes: r.notes || '',
    logo: r.logo_url || '', logoAssetId: r.logo_path || '', referredBy: r.referred_by || '', referredByOther: r.referred_by_other || '',
    addons: r.addons || [], noticeOn: r.notice_on || '', cancelCategory: r.cancel_category || '', rootCategory: r.root_category || '',
    rootReason: r.root_reason || '', controllable: r.controllable || '', contractTiming: r.contract_timing || '', warned: r.warned || '',
    firstWarningOn: r.first_warning_on || '', competitor: r.competitor || '', winBack: r.win_back || '', winBackOn: r.win_back_on || '',
    saves: r.saves || [], sb: r.sb || null, updatedAt: r.updated_at
  });
  const fromPlanRow = r => ({id:r.id, name:r.name, color:r.color, term:r.term||0, cadence:r.cadence||0, standard:!!r.standard, blurb:r.blurb||''});
  const fromLogRow = r => ({id:r.id, clientId:r.client_id, kind:r.kind, text:r.text||'', at:r.at, authorId:r.author_id||'', authorName:r.author_name||''});

  const fail = e => {
    if(!e) return;
    const code = (e.code === '42501' || /row-level security|permission/i.test(e.message||'')) ? 'forbidden'
      : (e.status === 429 ? 'rate_limited' : (e.code || 'error'));
    throw {code, message: e.message};
  };
  // Re-run a query whenever the table changes (simple and reliable for a few hundred rows).
  function watchTable(table, load, cb, filter){
    let alive = true, t = null;
    const run = async () => { try { const v = await load(); if(alive) cb(v); } catch(e){ console.error(e); } };
    run();
    const ch = sb.channel('gc-' + table + '-' + Math.random().toString(36).slice(2))
      .on('postgres_changes', Object.assign({event:'*', schema:'public', table}, filter ? {filter} : {}), () => { clearTimeout(t); t = setTimeout(run, 150); })
      .subscribe();
    return () => { alive = false; clearTimeout(t); sb.removeChannel(ch); };
  }

  return {
    async init(){
      const { data } = await sb.auth.getSession();
      session = data.session;
      sb.auth.onAuthStateChange((_e, s) => { const had = !!session; session = s; if(!had && s) location.reload(); });
      return { canWrite: !!session, userId: session ? session.user.id : null, needsSignIn: !session };
    },
    watchPlans(cb){
      return watchTable(T.plans, async () => { const { data, error } = await sb.from(T.plans).select('*').order('position'); fail(error); return data.map(fromPlanRow); }, cb);
    },
    watchClients(cb){
      return watchTable(T.clients, async () => { const { data, error } = await sb.from(T.clients).select('*').order('name'); fail(error); return data.map(fromClientRow); }, cb);
    },
    watchLog(clientId, cb){
      return watchTable(T.log, async () => { const { data, error } = await sb.from(T.log).select('*').eq('client_id', clientId).order('at', {ascending:false}).limit(200); fail(error); return data.map(fromLogRow); }, cb, 'client_id=eq.' + clientId);
    },
    async saveClient(c){ const { error } = await sb.from(T.clients).upsert(toClientRow(c)); fail(error); },
    async updateClient(id, fields){
      const row = {updated_at: new Date().toISOString()};
      Object.entries(fields).forEach(([k,v]) => { if(FIELD[k]) row[FIELD[k]] = (k === 'sb') ? (v||null) : (k === 'addons' || k === 'saves') ? (v||[]) : (k === 'health' ? (v||'') : nz(v)); });
      const { error } = await sb.from(T.clients).update(row).eq('id', id); fail(error);
    },
    async deleteClient(id){ const { error } = await sb.from(T.clients).delete().eq('id', id); fail(error); }, // log rows cascade
    async savePlans(plans){
      const rows = plans.map((p,i) => ({id:p.id, name:p.name, color:p.color, term:p.term||0, cadence:p.cadence||0, standard:!!p.standard, blurb:p.blurb||'', position:i}));
      const { error } = await sb.from(T.plans).upsert(rows); fail(error);
      const keep = rows.map(r => r.id);
      const { data, error: e2 } = await sb.from(T.plans).select('id'); fail(e2);
      const drop = data.map(r => r.id).filter(id => !keep.includes(id));
      if(drop.length){ const { error: e3 } = await sb.from(T.plans).delete().in('id', drop); fail(e3); }
    },
    async addLog(entry){
      const name = session ? (session.user.user_metadata?.full_name || session.user.email || '') : '';
      const { error } = await sb.from(T.log).insert({client_id:entry.clientId, kind:entry.kind, text:entry.text||'', at:entry.at, author_id: session ? session.user.id : null, author_name:name});
      fail(error);
    },
    async uploadLogo(blob){
      const path = `clients/${Date.now()}-${Math.random().toString(36).slice(2)}.png`;
      const { error } = await sb.storage.from(BUCKET).upload(path, blob, {contentType:'image/png', upsert:false}); fail(error);
      return { url: sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl, id: path };
    },
    async deleteLogo(path){ if(path && !path.startsWith('data:')) await sb.storage.from(BUCKET).remove([path]); },
    async userNames(){ return {}; }, // author_name is stored on each log row
    async signIn(email){ const { error } = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.href}}); fail(error); }
  };
}

/* ---------------------------------------------------------------------
   DEMO  (no server: loads grand-cast-data.json once, then keeps edits in
   this browser's localStorage. For trying the app locally only.)
   --------------------------------------------------------------------- */
function demoBackend(cfg){
  const KEY = 'grand-cast-demo';
  let store = null; const subs = new Set();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} subs.forEach(f => f()); };
  const copy = o => JSON.parse(JSON.stringify(o));
  async function load(){
    if(store) return;
    try { store = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){}
    if(!store){
      const r = await fetch(cfg.seedUrl || 'grand-cast-data.json');
      const d = await r.json();
      store = {plans: d.plans, clients: d.clients, log: d.log || []};
      save();
    }
  }
  const watch = (get, cb) => { const f = () => cb(copy(get())); subs.add(f); load().then(f); return () => subs.delete(f); };
  return {
    async init(){ await load(); return {canWrite:true, userId:'demo-user'}; },
    watchPlans: cb => watch(() => store.plans, cb),
    watchClients: cb => watch(() => store.clients, cb),
    watchLog: (id, cb) => watch(() => store.log.filter(l => l.clientId === id).sort((a,b) => b.at.localeCompare(a.at)), cb),
    async saveClient(c){ const i = store.clients.findIndex(x => x.id === c.id); const v = copy(c); v.updatedAt = new Date().toISOString(); if(i >= 0) store.clients[i] = v; else store.clients.push(v); save(); },
    async updateClient(id, f){ const c = store.clients.find(x => x.id === id); if(!c) throw {code:'error', message:'not found'}; Object.assign(c, copy(f), {updatedAt:new Date().toISOString()}); save(); },
    async deleteClient(id){ store.clients = store.clients.filter(x => x.id !== id); store.log = store.log.filter(l => l.clientId !== id); save(); },
    async savePlans(p){ store.plans = copy(p); save(); },
    async addLog(e){ store.log.push(Object.assign({id: Math.random().toString(36).slice(2), authorName:'You'}, copy(e))); save(); },
    async uploadLogo(blob){ const url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }); return {url, id:''}; },
    async deleteLogo(){},
    async userNames(ids){ return Object.fromEntries(ids.map(i => [i, 'You'])); }
  };
}
</script>

<script>
(function(){
'use strict';
/* ================= constants ================= */
const ADDONS = [
  {id:'site', name:'Template website', ok:s=>!s.standard, why:'custom site included on Standard'},
  {id:'content', name:'Content (social management)', ok:()=>true},

];
/* Churn taxonomy: category -> specific reasons. ctrl = default controllability. */
const CHURN = [
  {id:'results', name:'Results', ctrl:'partial', reasons:['Not enough leads','Leads were poor quality','Leads did not book or show','No return on the cost','Results dropped after a strong start']},
  {id:'price', name:'Price and value', ctrl:'partial', reasons:['Cash flow or could not afford it','Overpriced for what they got','Cut their ad budget','Found a cheaper option']},
  {id:'service', name:'Service and relationship', ctrl:'yes', reasons:['Slow or unclear communication','Account manager fit or turnover','Concierge handled leads poorly','Creative did not match their brand','Onboarding slow or never fully launched']},
  {id:'fit', name:'Fit and adoption', ctrl:'partial', reasons:['Did not use the system or work their leads','Technical or integration problems','Needed something GS does not offer','Wrong plan for their stage','Absentee owner','Conflict of interest','Agency ended agreement']},
  {id:'competitor', name:'Competitor', ctrl:'partial', reasons:['Switched to another agency','Took it in-house or hired staff','Joined a franchise or association program']},
  {id:'business', name:'Business change', ctrl:'no', reasons:['Closed the gym','Sold the gym','Owner health or life event','Paused or seasonal','Gym is at capacity','Merged or rebranded']},
  {id:'payment', name:'Payment (involuntary)', ctrl:'no', reasons:['Failed payment','Non-payment']},
  {id:'other', name:'Other', ctrl:'', reasons:['Other (explain in their words)']}
];
const CANCEL_REASONS = CHURN.map(x => x.name);
const LEGACY_REASONS = {'Price or budget':['price',''],'Not seeing results':['results',''],'Closed or sold the gym':['business',''],'Switched to another provider':['competitor','Switched to another agency'],'Took it in-house':['competitor','Took it in-house or hired staff'],'Paused or seasonal':['business','Paused or seasonal'],'Other':['other','']};
const CTRL = {yes:'Controllable', partial:'Partly controllable', no:'Uncontrollable'};
const SAVE_OFFERS = ['Pause','Downgrade','Strategy reset','Discount','Extra support or training','Other'];
const SAVE_OUTCOMES = {saved:'Saved', downgraded:'Saved with a downgrade', lost:'Lost'};
const TIMING = {onboarding:'During onboarding (first 60 days)', midterm:'Mid-term (left before the term ended)', renewal:'At renewal', monthly:'No fixed term (month-to-month)'};
const WINBACK = {yes:'Yes', maybe:'Maybe', no:'No'};
const catById = id => CHURN.find(x => x.id === id);
const catName = id => (catById(id) || {}).name || 'Not recorded';
/* normalize stated + root cause, including records saved with the old flat reason list */
function churnOf(c){
  let cat = c.cancelCategory || '', reason = c.cancelReason || '';
  if(!cat && reason){ const L = LEGACY_REASONS[reason]; if(L){ cat = L[0]; reason = L[1]; } else if(CANCEL_REASONS.includes(reason)) { cat = (CHURN.find(x=>x.name===reason)||{}).id || ''; reason = ''; } }
  const root = c.rootCategory || cat, rootReason = c.rootCategory ? (c.rootReason || '') : reason;
  return {cat, reason, root, rootReason, ctrl: c.controllable || (catById(root) || {}).ctrl || ''};
}
const churnLabel = (cat, reason) => cat ? catName(cat) + (reason ? ': ' + reason : '') : 'Not recorded';
/* suggested contract timing from start date, plan term and cancel date */
function suggestTiming(c, when){
  if(!c.since || !when) return '';
  const d = days(c.since, when); if(d <= 60) return 'onboarding';
  const s = svcById(c.serviceId), term = s && +s.term; if(!term) return 'monthly';
  // terms renew in blocks from the start date: within 30 days of a boundary = at renewal, otherwise an early exit mid-term
  for(let i = 1; i < 120; i++){ const r = addMonths(c.since, term*i); if(Math.abs(days(r, when)) <= 30) return 'renewal'; if(r > when) break; }
  return 'midterm';
}
function churnMissing(c){
  if(!isGone(c)) return [];
  const ch = churnOf(c), m = [];
  if(!ch.cat) m.push('reason'); else if(!ch.reason) m.push('specific reason');
  if(!c.rootCategory) m.push('root cause'); if(!c.controllable) m.push('controllable');
  if(!c.contractTiming) m.push('timing'); if(!c.winBack) m.push('win-back');
  return m;
}
const HEALTH = {
  green:{label:'Healthy', color:'#3FB950'},
  yellow:{label:'Watch', color:'#E3B341'},
  red:{label:'At risk', color:'#F85149'},
  '':{label:'Not set', color:'#7D8A99'}
};
const LOG_KINDS = {note:'Note', call:'Strategy call', contact:'Contact', win:'Win', issue:'Issue'};
const PALETTE = ['#F5A623','#2A9D8F','#7C5CBF','#3A7BD5','#F4722B','#E63946','#4CAF50','#D16BA5','#5BC0EB','#9BC53D'];
const REF = '#7FD1FF';
/* ---- scoreboard (read from GS Team Scoreboard; stored on each client as c.sb) ---- */
const SB_COLOR = {'on track':'#3FB950', 'watch':'#E3B341', 'at risk':'#F85149'};
const pct = (a, b) => b > 0 ? Math.round(100 * a / b) + '%' : '–';
function sbFunnel(title, m){
  const n = v => (v == null ? '–' : Math.round(v).toLocaleString('en-US'));

    <div style="overflow-x:auto"><table class="mini-t"><thead><tr><th>Leads</th><th>Booked</th><th>Showed</th><th>Closed</th><th>Ad spend</th><th>Per lead</th></tr></thead>
    <tbody><tr><td>${n(m.leads)}</td><td>${n(m.booked)} <small>${pct(m.booked,m.leads)}</small></td><td>${n(m.showed)} <small>${pct(m.showed,m.booked)}</small></td><td>${n(m.closed)} <small>${pct(m.closed,m.showed)}</small></td><td>${money(m.adSpend||0)}</td><td>${m.cpl!=null?'$'+(+m.cpl).toFixed(2):'–'}</td></tr></tbody></table></div>
    ${(m.avgGymRevenue||m.gymRevenue) ? `<p class="empty" style="margin:4px 0 0">Gym's reported monthly revenue: ${money(m.avgGymRevenue||m.gymRevenue)}${m.avgGymRevenue?' (average)':''}</p>` : ''}`;
}
function sbHTML(c){
  const b = c.sb; if(!b) return '';
  const M = b.meta90;
  return `<div class="log"><h3>Scoreboard</h3><p class="empty" style="margin:0 0 6px">From GS Team Scoreboard (${esc(b.id)}), read ${esc(fmtDate(b.syncedAt))}.</p>
    <dl>
      ${b.score!=null?`<dt>Score</dt><dd><span class="hdot"><span class="dot" style="background:${SB_COLOR[b.health]||'#7D8A99'}"></span>${b.score}, ${esc(b.health)}</span></dd>`:(b.callDay?'<dt>Score</dt><dd><span style="color:var(--muted)">No score yet</span></dd>':'')}
      ${b.callDay?`<dt>Weekly call</dt><dd>${esc(b.callDay)} ${esc(b.callTime)}${b.callAccount && b.callAccount!==c.name?` <small style="color:var(--muted)">(board name "${esc(b.callAccount)}")</small>`:''}</dd>`:''}

    ${M ? `<p style="margin:10px 0 4px;font-weight:600">Meta ads, last 90 days</p><p style="margin:0;font-size:14px">${money(M.spend)} spent, ${M.leads} leads${M.cpl!=null?`, $${M.cpl.toFixed(2)} per lead`:''}, ${M.clicks.toLocaleString('en-US')} clicks across ${M.campaigns} ${M.campaigns===1?'campaign':'campaigns'}</p>` : ''}
  </div>`;
}

/* ================= state ================= */
const S = {services:[], clients:[], plansLoaded:false, clientsLoaded:false};
const ui = loadUI();
let B = null, canWrite = false, myId = null, needsSignIn = false, loadError = '';
let selected = null, focusGroup = null, layoutCache = null, vb = null, userMoved = false;
let asOf = null;            // null = today; otherwise ISO date for the timeline
let query = '';
let logs = [], logUnsub = null, logFor = null;
let tableSel = new Set(), sortKey = 'name', sortDir = 1;
const profileCache = {};

function loadUI(){
  const d = {view:'map', colorBy:'plan', groupBy:'plan', showCancelled:true, showReferrals:true};
  try { return Object.assign(d, JSON.parse(localStorage.getItem('gc-ui2')||'{}')); } catch(e){ return d; }
}
function saveUI(){ try { localStorage.setItem('gc-ui2', JSON.stringify(ui)); } catch(e){} }

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const svcById = id => S.services.find(s => s.id === id);
const byId = id => S.clients.find(c => c.id === id);
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const initials = n => { const w = (n||'').split(/\s+/).filter(x => /[A-Za-z0-9]/.test(x[0]||'')); if(!w.length) return '?'; return (w.length>1 ? w[0][0]+w[w.length-1][0] : w[0].slice(0,2)).toUpperCase(); };
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
const TODAY = iso(new Date());
const parse = d => new Date(d + 'T12:00:00');
const days = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
function addMonths(d, m){ const t = parse(d); const day = t.getDate(); t.setDate(1); t.setMonth(t.getMonth()+m); const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate(); t.setDate(Math.min(day,last)); return iso(t); }
function fmtDate(d, short){ if(!d) return ''; const t = parse(d); return isNaN(t) ? d : t.toLocaleDateString(undefined, short ? {month:'short', day:'numeric'} : {month:'short', day:'numeric', year:'numeric'}); }
function monthsBetween(a, b){ const x = parse(a), y = parse(b); let m = (y.getFullYear()-x.getFullYear())*12 + (y.getMonth()-x.getMonth()); if(y.getDate() < x.getDate()) m--; return Math.max(0, m); }
function tenureText(from, to){
  if(!from) return '';
  const m = monthsBetween(from, to || TODAY);
  if(m < 1) return 'Less than a month';
  const y = Math.floor(m/12), r = m%12, p = [];
  if(y) p.push(y + (y===1?' year':' years')); if(r) p.push(r + (r===1?' month':' months'));
  return p.join(', ');
}
function stateOf(c){ const m = (c.location||'').match(/,\s*([A-Za-z]{2})\s*$/); return m ? m[1].toUpperCase() : ''; }
const isGone = c => c.status === 'cancelled';
const referred = c => !!(c.referredBy || c.referredByOther);
const referralsOf = id => S.clients.filter(x => x.referredBy === id);
function clientAddons(c){ const s = svcById(c.serviceId); return (c.addons||[]).map(id => ADDONS.find(a => a.id === id)).filter(a => a && s && a.ok(s)); }

/* next renewal: contract rolls forward in plan-term blocks from the start date */
function nextRenewal(c){
  const s = svcById(c.serviceId);
  if(!s || !s.term || !c.since || isGone(c)) return null;
  let d = addMonths(c.since, +s.term), i = 1;
  while(d < TODAY && i < 400){ i++; d = addMonths(c.since, +s.term * i); }
  return d;
}

/* signals that make a client actionable */
function flagsFor(c){
  const f = [];
  if(isGone(c)) return f;
  const s = svcById(c.serviceId);
  const r = nextRenewal(c);
  if(r){ const n = days(TODAY, r);
    if(n <= 30) f.push({level:'red', key:'renewal', text: n === 0 ? `Renews today (${fmtDate(r)})` : `Renews in ${n} ${n===1?'day':'days'} (${fmtDate(r)})`});
    else if(n <= 60) f.push({level:'amber', key:'renewal', text:`Renews in ${n} days (${fmtDate(r)})`});
    else if(n <= 90) f.push({level:'info', key:'renewal', text:`Renews in ${n} days (${fmtDate(r)})`});
  }
  if(c.health === 'red') f.push({level:'red', key:'health', text:'Marked at risk'});
  else if(c.health === 'yellow') f.push({level:'amber', key:'health', text:'Marked as watch'});
  const cad = s && +s.cadence;
  if(cad){
    if(c.lastCall){ const n = days(c.lastCall, TODAY);
      if(n > cad*2) f.push({level:'red', key:'call', text:`No strategy call in ${n} days`});
      else if(n > Math.round(cad*1.5)) f.push({level:'amber', key:'call', text:`Strategy call due (${n} days since last)`});
    } else f.push({level:'info', key:'call', text:'No strategy call logged yet'});
  }
  if(c.lastContact){ const n = days(c.lastContact, TODAY); if(n > 30) f.push({level:'amber', key:'contact', text:`No contact in ${n} days`}); }
  return f;
}
const needsAttention = c => flagsFor(c).some(f => f.level === 'red' || f.level === 'amber');
const attentionLevel = c => { const f = flagsFor(c); return f.some(x=>x.level==='red') ? 2 : f.some(x=>x.level==='amber') ? 1 : 0; };

/* timeline: the roster as it stood on a given date */
function statusAt(c){
  if(!asOf) return c.status;
  if(c.since && c.since > asOf) return 'future';
  if(isGone(c) && (!c.cancelledOn || c.cancelledOn <= asOf)) return 'cancelled';
  return 'active';
}
function roster(){
  return S.clients.map(c => ({c, st: statusAt(c)})).filter(x => x.st !== 'future' && (ui.showCancelled || x.st !== 'cancelled'));
}

/* grouping */
function groupKey(c){
  switch(ui.groupBy){
    case 'manager': return 'm:' + (c.manager || 'Unassigned');
    case 'year': return 'y:' + (c.since ? c.since.slice(0,4) : 'No start date');
    case 'health': return 'h:' + (c.health || '');
    case 'state': return 's:' + (stateOf(c) || 'No location');
    default: return c.serviceId || 'none';
  }
}
function groupMeta(key, i){
  if(ui.groupBy === 'plan'){ const s = svcById(key); return {name: s ? s.name : 'No plan', color: s ? s.color : '#7D8A99'}; }
  if(ui.groupBy === 'health'){ const h = HEALTH[key.slice(2)] || HEALTH['']; return {name: h.label, color: h.color}; }
  return {name: key.slice(2), color: PALETTE[i % PALETTE.length]};
}
function ringColor(c, st){
  if(st === 'cancelled') return '#8e9aaa';
  if(ui.colorBy === 'health') return (HEALTH[c.health||''] || HEALTH['']).color;
  if(ui.colorBy === 'renewal'){ const r = nextRenewal(c); if(!r) return '#4F6D8A'; const n = days(TODAY, r); return n <= 30 ? '#F85149' : n <= 60 ? '#E3B341' : n <= 90 ? '#5BC0EB' : '#4F6D8A'; }
  if(ui.colorBy === 'score') return (c.sb && SB_COLOR[c.sb.health]) || '#4F6D8A';
  if(ui.colorBy === 'attention'){ const l = attentionLevel(c); return l === 2 ? '#F85149' : l === 1 ? '#E3B341' : '#3FB950'; }
  const s = svcById(c.serviceId); return s ? s.color : '#7D8A99';
}
function logoHTML(c, cls){

}
function mini(c){ const s = svcById(c.serviceId); return `<span class="mini${isGone(c)?' gone':''}" style="--c:${esc(s?s.color:'#ccc')}">${c.logo?`<img src="${esc(c.logo)}" alt="">`:esc(initials(c.name))}</span>`; }

/* ================= layout ================= */
function computeLayout(){
  const items = roster();
  const keys = [];
  if(ui.groupBy === 'plan') S.services.forEach(s => keys.push(s.id));
  items.forEach(x => { const k = groupKey(x.c); if(!keys.includes(k)) keys.push(k); });
  if(ui.groupBy !== 'plan') keys.sort((a,b) => {
    if(ui.groupBy === 'health'){ const o = {'h:red':0,'h:yellow':1,'h:green':2,'h:':3}; return (o[a]??9) - (o[b]??9); }
    return a.localeCompare(b);
  });
  const groups = [];
  keys.forEach((k, i) => {
    const list = items.filter(x => groupKey(x.c) === k)
      .sort((a,b) => (a.st==='cancelled') - (b.st==='cancelled') || a.c.name.localeCompare(b.c.name));
    if(!list.length) return;
    const meta = groupMeta(k, i);
    const rings = []; let placed = 0, ring = 0;
    const span0 = 2*Math.PI - 0.9;
    while(placed < list.length){
      const r = 112 + ring*96, cap = Math.max(5, Math.floor(span0*r/112));
      const take = Math.min(cap, list.length - placed);
      rings.push({r, items:list.slice(placed, placed+take), full: take === cap}); placed += take; ring++;
    }
    const outer = rings.length ? rings[rings.length-1].r + 48 : 70;
    groups.push({key:k, meta, rings, outer, count:list.filter(x=>x.st!=='cancelled').length});
  });
  const n = groups.length;
  const W = groups.reduce((t,g) => t + g.outer + 25, 0) || 1;
  const hubs = [], nodes = [];
  let acc = -Math.PI/2 - (n ? Math.PI*(groups[0].outer+25)/W : 0);
  groups.forEach(g => {
    const share = 2*Math.PI*(g.outer+25)/W, ang = acc + share/2; acc += share;
    const half = Math.min(share/2, Math.PI/2 - 0.05);
    const R = n === 1 ? 95 + g.outer : Math.max(95 + g.outer, (g.outer+25)/Math.sin(half));
    const hx = R*Math.cos(ang), hy = R*Math.sin(ang);
    hubs.push({key:g.key, meta:g.meta, x:hx, y:hy, count:g.count});
    const toward = ang + Math.PI, gap = 0.9, span = 2*Math.PI - gap;
    g.rings.forEach((ring, ri) => {
      const k = ring.items.length, step = span / k, shift = (ri % 2 && ring.full) ? step/2 : 0;
      ring.items.forEach((x, j) => {
        const a = toward + gap/2 + (j + 0.5) * step + shift;
        nodes.push({c:x.c, st:x.st, key:g.key, color:g.meta.color, hx, hy, x: hx + ring.r*Math.cos(a), y: hy + ring.r*Math.sin(a)});
      });
    });
  });
  let minX=-80, minY=-80, maxX=80, maxY=80;
  const grow = (x,y,rx,top,bot) => { minX=Math.min(minX,x-rx); maxX=Math.max(maxX,x+rx); minY=Math.min(minY,y-top); maxY=Math.max(maxY,y+bot); };
  hubs.forEach(h => grow(h.x,h.y,70,70,70));
  nodes.forEach(nd => grow(nd.x,nd.y,72,44,72));
  return {hubs, nodes, bounds:{x:minX-16, y:minY-16, w:maxX-minX+32, h:maxY-minY+32}};
}

/* ================= map ================= */
function wrapWords(t, max){
  const words = String(t).split(/\s+/), lines = []; let cur = '';
  words.forEach(w => { if((cur+' '+w).trim().length > max && cur){ lines.push(cur); cur = w; } else cur = (cur+' '+w).trim(); });
  if(cur) lines.push(cur);
  if(lines.length > 3){ lines.length = 3; lines[2] = lines[2].slice(0, max-1) + '…'; }
  return lines;
}
const trunc = (t, n) => t.length > n ? t.slice(0, n-1) + '…' : t;

function renderMap(){

    hubs += `<g class="node hub${d}" data-group="${esc(h.key)}" transform="translate(${h.x},${h.y})" tabindex="0" role="button" aria-label="${esc(h.meta.name)}, ${h.count} active">

    const art = c.logo

    const ad = clientAddons(c).length, attn = !gone && !asOf ? attentionLevel(c) : 0;
    nodes += `<g class="node client${gone?' cancelled':''}${dim}${selected===c.id?' sel':''}${match?' match':''}" data-id="${esc(c.id)}" transform="translate(${nd.x},${nd.y})" tabindex="0" role="button" aria-label="${esc(c.name)}${gone?', cancelled':''}${attn?', needs attention':''}">
      <title>${esc(c.name)}</title>
      ${selected===c.id?'<circle r="42" fill="none" stroke="#ffffff" stroke-width="2.5"/>':''}
      <circle class="focusring" r="42" fill="none" stroke="transparent"/>
      <g class="art">${art}<circle r="33.5" fill="none" stroke="${esc(col)}" stroke-width="${ui.colorBy==='plan'?3:4.5}" ${gone?'stroke-dasharray="5 4"':''}/></g>
      ${ad && !gone ? `<g transform="translate(24,-24)"><circle r="10" fill="#F5A623" stroke="#0d1b2a" stroke-width="2"/><text class="ab">+${ad}</text></g>` : ''}
      ${attn && ui.colorBy !== 'attention' ? `<g transform="translate(-24,-24)"><circle r="8" fill="${attn===2?'#F85149':'#E3B341'}" stroke="#0d1b2a" stroke-width="2"/><text class="ab" style="font-size:11px">!</text></g>` : ''}
      <text class="nm" y="52">${esc(trunc(c.name,22))}</text>
      ${gone?'<text class="gone" y="66">Cancelled</text>':''}</g>`;
  });
  if(ui.showReferrals !== false){
    L.nodes.forEach(b => {
      const a = b.c.referredBy && pos[b.c.referredBy]; if(!a) return;
      const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy) || 1;
      const cx = (a.x+b.x)/2 - dy*0.22, cy = (a.y+b.y)/2 + dx*0.22;
      const la = Math.hypot(cx-a.x, cy-a.y) || 1, lb = Math.hypot(b.x-cx, b.y-cy) || 1;
      const sx = a.x + (cx-a.x)/la*36, sy = a.y + (cy-a.y)/la*36, ex = b.x - (b.x-cx)/lb*39, ey = b.y - (b.y-cy)/lb*39;
      const hot = selected && (selected === a.c.id || selected === b.c.id);
      const cls = selected ? (hot ? ' hot' : ' faint') : ((dimFor(a.key) && dimFor(b.key)) || q ? ' faint' : '');
      refs += `<path class="ref${cls}" d="M${sx},${sy} Q${cx},${cy} ${ex},${ey}" marker-end="url(#arr)"><title>${esc(a.c.name)} referred ${esc(b.c.name)}</title></path>`;
    });
  }
  const center = `<g class="center"><circle r="62" fill="#F5A623"/><circle r="70" fill="none" stroke="rgba(245,166,35,.35)" stroke-width="1.5"/>
    <text class="c1" dy="-8" dominant-baseline="central">GS</text><text class="c2" y="24">GROUND STANDARD</text></g>`;
  svg.innerHTML = `<defs><filter id="gray"><feColorMatrix type="saturate" values="0"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${REF}"/></marker></defs>
    <g class="svgtxt">${edges}${center}${hubs}${refs}${nodes}</g>`;
  const ao = $('asof'); ao.hidden = !asOf; if(asOf) ao.textContent = 'Roster as of ' + fmtDate(asOf);

/* ================= timeline ================= */
let tlMin = TODAY, tlPlayT = null;
function renderTimeline(){
  const starts = S.clients.map(c => c.since).filter(Boolean).sort();
  tlMin = starts[0] || TODAY;
  const span = Math.max(1, days(tlMin, TODAY));
  const r = $('tl'); r.max = span; r.value = asOf ? days(tlMin, asOf) : span;
  updateWhen();
}
function updateWhen(){
  const d = asOf || TODAY;
  const n = !asOf ? S.clients.filter(c => !isGone(c)).length : S.clients.filter(c => statusAt(c) === 'active').length;
  $('tlWhen').innerHTML = `${asOf ? fmtDate(asOf) : 'Today'}<small>${n} active</small>`;
  $('tlToday').hidden = !asOf;
}
function setAsOf(d){
  asOf = (!d || d >= TODAY) ? null : d;
  if(asOf) selected = null;
  layoutCache = computeLayout(); renderMap(); updateWhen(); if(!userMoved) fit(); else applyVB();
  if(ui.view === 'map') renderPanel();
}
$('tl').addEventListener('input', e => { stopPlay(); const t = parse(tlMin); t.setDate(t.getDate() + +e.target.value); setAsOf(iso(t)); });
$('tlToday').addEventListener('click', () => { stopPlay(); setAsOf(null); renderTimeline(); });
$('tlPlay').addEventListener('click', () => {
  if(tlPlayT) return stopPlay();
  let d = tlMin; $('tlPlay').textContent = 'Pause';
  tlPlayT = setInterval(() => {
    d = addMonths(d, 1);
    if(d >= TODAY){ stopPlay(); setAsOf(null); renderTimeline(); return; }
    setAsOf(d); $('tl').value = days(tlMin, d);
  }, 450);
});
function stopPlay(){ if(tlPlayT){ clearInterval(tlPlayT); tlPlayT = null; } $('tlPlay').textContent = 'Play'; }

/* ================= pan & zoom ================= */
function fit(){
  if(!layoutCache) return;
  const b = layoutCache.bounds, r = svg.getBoundingClientRect();
  const ar = (r.width||800)/(r.height||600);
  let w = b.w, h = b.h;
  if(w/h > ar) h = w/ar; else w = h*ar;
  vb = {x: b.x + b.w/2 - w/2, y: b.y + b.h/2 - h/2, w, h}; userMoved = false; applyVB();
}
function refit(){
  if(!userMoved || !vb) return fit();
  const r = svg.getBoundingClientRect(); if(!r.width || !r.height) return;
  const cx = vb.x + vb.w/2, cy = vb.y + vb.h/2, ar = r.width/r.height;
  const h = Math.max(vb.h, vb.w/ar), w = h*ar;
  vb = {x: cx-w/2, y: cy-h/2, w, h}; applyVB();
}
function applyVB(){
  if(!vb) return;
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const r = svg.getBoundingClientRect();
  svg.classList.toggle('quiet', r.width && (r.width / vb.w) < 0.78);
}
function zoomBy(f, cx, cy){
  if(!vb) return;
  if(cx === undefined){ cx = vb.x + vb.w/2; cy = vb.y + vb.h/2; }
  const nw = Math.min(Math.max(vb.w*f, 200), 30000), k = nw/vb.w;
  vb = {x: cx - (cx-vb.x)*k, y: cy - (cy-vb.y)*k, w: nw, h: vb.h*k}; userMoved = true; applyVB();
}
function toSvg(e){ const r = svg.getBoundingClientRect(); return {x: vb.x + (e.clientX-r.left)/r.width*vb.w, y: vb.y + (e.clientY-r.top)/r.height*vb.h}; }
svg.addEventListener('wheel', e => { if(!vb) return; e.preventDefault(); const p = toSvg(e); zoomBy(e.deltaY>0?1.12:0.89, p.x, p.y); }, {passive:false});
let drag = null;
svg.addEventListener('pointerdown', e => { if(vb) drag = {sx:e.clientX, sy:e.clientY, vx:vb.x, vy:vb.y, moved:false, id:e.pointerId}; });
svg.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX-drag.sx, dy = e.clientY-drag.sy;
  if(!drag.moved && Math.hypot(dx,dy) > 5){ drag.moved = true; svg.classList.add('dragging'); try{ svg.setPointerCapture(e.pointerId); }catch(_){} }
  if(drag.moved){ userMoved = true; const r = svg.getBoundingClientRect(); vb.x = drag.vx - dx/r.width*vb.w; vb.y = drag.vy - dy/r.height*vb.h; applyVB(); }
});
const endDrag = e => { if(!drag) return; const moved = drag.moved; drag = null; svg.classList.remove('dragging'); if(!moved && e.type === 'pointerup') activate(e.target); };
svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(e.target); } });
function activate(t){
  const cl = t.closest && t.closest('.client'), hub = t.closest && t.closest('.hub');
  if(cl) return selectClient(cl.dataset.id, false);
  if(hub){ focusGroup = focusGroup === hub.dataset.group ? null : hub.dataset.group; selected = null; renderMap(); return renderPanel(); }
}
let rzT; new ResizeObserver(() => { clearTimeout(rzT); rzT = setTimeout(refit, 60); }).observe(svg);

function selectClient(id, pan){
  const c = byId(id); if(!c) return;
  if(ui.view !== 'map') setView('map');
  selected = id;
  if(asOf && statusAt(c) === 'future'){ asOf = null; renderTimeline(); layoutCache = computeLayout(); }
  if(isGone(c) && !ui.showCancelled){ ui.showCancelled = true; $('showCancelled').checked = true; saveUI(); layoutCache = computeLayout(); }
  renderMap(); renderPanel();
  if(pan){ const nd = layoutCache.nodes.find(n => n.c.id === id); if(nd && vb){ const w = Math.min(vb.w, 1400), h = vb.h * w / vb.w; vb = {x: nd.x - w/2, y: nd.y - h/2, w, h}; userMoved = true; applyVB(); } }
}
function openPanel(html){
  const p = $('panel'); const key = selected || focusGroup; if(p.dataset.key !== key){ p.scrollTop = 0; p.dataset.key = key || ''; } p.innerHTML = `<button class="x" id="pClose" aria-label="Close">×</button>` + html; p.hidden = false; $('stage').classList.add('has-panel');
  $('pClose').addEventListener('click', () => { selected = null; focusGroup = null; closePanel(); renderMap(); });
  p.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => selectClient(b.dataset.go, true)));
}
function closePanel(){ $('panel').hidden = true; $('stage').classList.remove('has-panel'); stopLog(); }
function renderPanel(){
  if(selected && byId(selected)) return showClientPanel(byId(selected));
  if(focusGroup) return showGroupPanel(focusGroup);
  closePanel();
}

/* activity log subscription: one per open client */
function stopLog(){ if(logUnsub){ logUnsub(); logUnsub = null; } logFor = null; }
function watchLog(id){
  if(logFor === id){ renderLog(); return; }
  stopLog(); logs = []; logFor = id;
  if(!B) return;
  logUnsub = B.watchLog(id, list => { logs = list.slice().sort((a,b) => (b.at||'').localeCompare(a.at||'')); renderLog(); });
}
async function renderLog(){
  const el = $('logList'); if(!el) return;
  if(!logs.length){ el.innerHTML = '<p class="empty">No activity yet. Log calls, wins and issues here so the whole team sees the history.</p>'; return; }
  const ids = [...new Set(logs.filter(l => !l.authorName).map(l => l.authorId).filter(Boolean))].filter(i => !(i in profileCache));
  if(ids.length && B){ try { const ps = await B.userNames(ids); ids.forEach(i => profileCache[i] = (ps && ps[i]) || ''); } catch(e){ ids.forEach(i => profileCache[i] = ''); } }
  if(!$('logList')) return;
  $('logList').innerHTML = logs.slice(0, 40).map(l => `<div class="entry"><div class="meta"><span class="kind ${esc(l.kind)}">${esc(LOG_KINDS[l.kind]||'Note')}</span><span>${esc(fmtDate((l.at||'').slice(0,10)))}</span><span>${esc(l.authorName || profileCache[l.authorId] || '')}</span></div>${l.text?`<p>${esc(l.text)}</p>`:''}</div>`).join('') + (logs.length > 40 ? `<p class="empty">Showing the latest 40 of ${logs.length} entries.</p>` : '');
}

async function exportCSV(rows){

  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const lines = [head.join(',')].concat(rows.map(c => [c.name, svcById(c.serviceId)?.name||'', isGone(c)?'Cancelled':'Active', isGone(c)?'':HEALTH[c.health||''].label,
